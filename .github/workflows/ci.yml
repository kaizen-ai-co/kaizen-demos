name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATOS_PROVEEDOR: memoria

jobs:
  validar:
    name: Validar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Lint (TypeScript, React, Next, accesibilidad)
        run: npm run lint
      - name: Esquemas y semillas
        run: npm run validar:esquemas
      - name: Contraste
        run: npm run validar:contraste
      - name: Licencias
        run: npm run validar:licencias
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test

  construir:
    name: Build ${{ matrix.app }}
    needs: validar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [comercial, presentacion, catalogo, visor3d, panel, agenda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @kaizen/app-${{ matrix.app }}
      - name: Recorrido e2e (si existe)
        run: |
          if [ -f pruebas/e2e/${{ matrix.app }}.spec.ts ]; then
            npx playwright install --with-deps chromium
            APP=${{ matrix.app }} npx playwright test pruebas/e2e/${{ matrix.app }}.spec.ts pruebas/e2e/acceso.spec.ts
          fi
        env:
          ENTRAR_COMO_PRUEBA: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-${{ matrix.app }}
          path: capturas/
          if-no-files-found: ignore

  imagen:
    name: Imagen Docker (comercial)
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP=comercial -t kaizen/comercial:ci .
